[package]
name = "mijote"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A TUI orchestrator for the coding agents you already pay for"

[[bin]]
name = "mijote"
path = "src/main.rs"

[dependencies]
anyhow    = "1"
clap      = { version = "4", features = ["derive"] }
thiserror = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
